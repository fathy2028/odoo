services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build: .
    image: odoo-ecom:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-odoo}
      DB_PASSWORD: ${DB_PASSWORD:-odoo}
      ODOO_DB: ${ODOO_DB:-ecom}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-website_sale,fathy}
      ODOO_WITH_DEMO: ${ODOO_WITH_DEMO:-true}
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_GEVENT_PORT:-8072}:8072"
    volumes:
      - odoo-data:/var/lib/odoo                   # filestore (attachments, product images) + sessions
      - ./custom_addons:/opt/odoo/custom_addons   # live-mount your modules over the copy baked into the image
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro

volumes:
  db-data:
  odoo-data:
