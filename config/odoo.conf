[options]
; Database connection is passed by docker/entrypoint.sh from .env

; Master password for the database manager (/web/database/manager). CHANGE THIS.
admin_passwd = fathy

; Core addons from the source checkout + your own modules
addons_path = /opt/odoo/addons,/opt/odoo/custom_addons
data_dir = /var/lib/odoo

; Must listen on all interfaces inside the container (Odoo 20 defaults to 127.0.0.1)
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072

; 0 = single threaded process (good for development).
; For production set workers >= 2; websockets/live chat are then served on gevent_port (8072).
workers = 0
max_cron_threads = 1

; Set to True when running behind a reverse proxy (nginx, traefik...)
proxy_mode = False

limit_time_cpu = 600
limit_time_real = 1200

log_level = info
